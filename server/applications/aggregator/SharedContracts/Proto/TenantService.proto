syntax = "proto3";

option csharp_namespace = "SharedContracts";

package TenantService;

service TenantQueries {
  rpc GetTenantInfo (GetTenantInfoRequest) returns (GetTenantInfoReply);
}

message GetTenantInfoRequest {
  string TenantCognitoId = 1;
}

message GetTenantInfoReply {
  string TenantCognitoId = 1;
  string Name = 2;
  string PhoneNumber = 3;
  string Email = 4;
}